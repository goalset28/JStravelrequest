<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>差旅申请管理</title>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@ui5/webcomponents@2/dist/bundle.esm.js"></script>
  <script type="module" src="https://cdn.jsdelivr.net/npm/@ui5/webcomponents-fiori@2/dist/bundle.esm.js"></script>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "72", "72full", Arial, Helvetica, sans-serif;
      background: #f5f6fa;
      color: #32363a;
    }
    .app-header {
      background: #0a6ed1;
      color: white;
      padding: 0 24px;
      height: 48px;
      display: flex;
      align-items: center;
      font-size: 16px;
      font-weight: 600;
    }
    .app-header span { margin-left: 8px; }
    .tabs {
      display: flex;
      background: white;
      border-bottom: 1px solid #d9d9d9;
      padding: 0 24px;
    }
    .tab {
      padding: 14px 20px;
      cursor: pointer;
      font-size: 14px;
      border-bottom: 3px solid transparent;
      color: #6a6d70;
      transition: all 0.2s;
    }
    .tab.active {
      color: #0a6ed1;
      border-bottom-color: #0a6ed1;
      font-weight: 600;
    }
    .content { padding: 24px; max-width: 800px; margin: 0 auto; }
    .card {
      background: white;
      border-radius: 8px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
      padding: 24px;
      margin-bottom: 16px;
    }
    .card-title {
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 20px;
      color: #32363a;
    }
    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-group.full { grid-column: 1 / -1; }
    label {
      font-size: 13px;
      font-weight: 500;
      color: #6a6d70;
    }
    label .required { color: #bb0000; margin-left: 2px; }
    input, select, textarea {
      padding: 8px 10px;
      border: 1px solid #bfbfbf;
      border-radius: 4px;
      font-size: 14px;
      font-family: inherit;
      transition: border-color 0.15s;
      outline: none;
    }
    input:focus, select:focus, textarea:focus { border-color: #0a6ed1; }
    input[readonly] { background: #f4f4f4; color: #6a6d70; }
    textarea { resize: vertical; min-height: 80px; }
    .amount-hint {
      font-size: 12px;
      margin-top: 4px;
      padding: 6px 10px;
      border-radius: 4px;
    }
    .amount-hint.auto { background: #e8f5e9; color: #2e7d32; }
    .amount-hint.single { background: #fff8e1; color: #f57f17; }
    .amount-hint.multi { background: #fce4ec; color: #c62828; }
    .btn {
      padding: 10px 24px;
      border: none;
      border-radius: 4px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary { background: #0a6ed1; color: white; }
    .btn-primary:hover { background: #085ca0; }
    .btn-primary:disabled { background: #a5c8f0; cursor: not-allowed; }
    .btn-secondary { background: #f4f4f4; color: #32363a; border: 1px solid #bfbfbf; }
    .btn-secondary:hover { background: #e8e8e8; }
    .btn-group { display: flex; gap: 12px; margin-top: 20px; }
    .status-badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 12px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-DRAFT { background: #f0f0f0; color: #6a6d70; }
    .status-PENDING { background: #e3f2fd; color: #0d47a1; }
    .status-AUTO_APPROVED { background: #e8f5e9; color: #1b5e20; }
    .status-L1_REVIEWING { background: #fff8e1; color: #e65100; }
    .status-MULTI_LEVEL_REVIEWING { background: #fce4ec; color: #880e4f; }
    .status-APPROVED { background: #e8f5e9; color: #1b5e20; }
    .status-REJECTED { background: #ffebee; color: #b71c1c; }
    .alert {
      padding: 12px 16px;
      border-radius: 6px;
      font-size: 14px;
      margin-bottom: 16px;
    }
    .alert-success { background: #e8f5e9; color: #2e7d32; border: 1px solid #a5d6a7; }
    .alert-error { background: #ffebee; color: #b71c1c; border: 1px solid #ef9a9a; }
    .alert-info { background: #e3f2fd; color: #0d47a1; border: 1px solid #90caf9; }
    .history-item {
      border-left: 3px solid #0a6ed1;
      padding: 10px 14px;
      margin-bottom: 10px;
      background: #fafafa;
      border-radius: 0 4px 4px 0;
    }
    .history-item .approver { font-weight: 600; font-size: 14px; }
    .history-item .meta { font-size: 12px; color: #6a6d70; margin-top: 4px; }
    .search-bar {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    .search-bar input { flex: 1; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th {
      text-align: left;
      padding: 10px 12px;
      background: #f4f4f4;
      border-bottom: 2px solid #e0e0e0;
      font-weight: 600;
      color: #6a6d70;
    }
    td { padding: 10px 12px; border-bottom: 1px solid #f0f0f0; }
    tr:hover td { background: #fafafa; }
    .empty-state {
      text-align: center;
      padding: 48px 24px;
      color: #6a6d70;
    }
    .empty-state .icon { font-size: 48px; margin-bottom: 12px; }
    .loading { text-align: center; padding: 24px; color: #6a6d70; }
    .detail-row { display: flex; gap: 24px; margin-bottom: 12px; }
    .detail-label { font-size: 12px; color: #6a6d70; min-width: 80px; }
    .detail-value { font-size: 14px; font-weight: 500; }
    @media (max-width: 600px) {
      .form-grid { grid-template-columns: 1fr; }
      .content { padding: 16px; }
    }
  </style>
</head>
<body>

<div class="app-header">
  ✈️ <span>差旅申请管理系统</span>
</div>

<div class="tabs">
  <div class="tab active" id="tab-submit" onclick="switchTab('submit')">提交申请</div>
  <div class="tab" id="tab-query" onclick="switchTab('query')">申请查询</div>
</div>

<div class="content">

  <!-- ── 提交申请页 ── -->
  <div id="page-submit">
    <div id="submit-alert" style="display:none"></div>

    <div class="card">
      <div class="card-title">📋 填写差旅申请</div>
      <form id="travel-form">
        <div class="form-grid">

          <div class="form-group">
            <label>申请人姓名 <span class="required">*</span></label>
            <input type="text" id="employeeName" placeholder="请输入姓名" required />
          </div>

          <div class="form-group">
            <label>申请人邮箱 <span class="required">*</span></label>
            <input type="email" id="employeeEmail" placeholder="name@company.com" required />
          </div>

          <div class="form-group">
            <label>目的地 <span class="required">*</span></label>
            <input type="text" id="destination" placeholder="例：上海" required />
          </div>

          <div class="form-group">
            <label>成本中心 <span class="required">*</span></label>
            <input type="text" id="costCenter" placeholder="例：CC1000" required />
          </div>

          <div class="form-group">
            <label>出发日期 <span class="required">*</span></label>
            <input type="date" id="departureDate" required />
          </div>

          <div class="form-group">
            <label>返回日期 <span class="required">*</span></label>
            <input type="date" id="returnDate" required />
          </div>

          <div class="form-group">
            <label>申请金额（元）<span class="required">*</span></label>
            <input type="number" id="estimatedAmount" placeholder="0.00" min="0.01" step="0.01" required oninput="updateAmountHint()" />
            <div id="amount-hint" class="amount-hint" style="display:none"></div>
          </div>

          <div class="form-group">
            <label>直接上级邮箱 <span class="required">*</span></label>
            <input type="email" id="managerEmail" placeholder="manager@company.com" required />
          </div>

          <div class="form-group">
            <label>部门经理邮箱</label>
            <input type="email" id="departmentManagerEmail" placeholder="deptmgr@company.com（>10,000元时必填）" />
          </div>

          <div class="form-group">
            <label>财务负责人邮箱</label>
            <input type="email" id="financeEmail" placeholder="finance@company.com（>10,000元时必填）" />
          </div>

          <div class="form-group full">
            <label>出行事由 <span class="required">*</span></label>
            <textarea id="purpose" placeholder="请简要说明本次差旅的目的和必要性" required></textarea>
          </div>

        </div>

        <div class="btn-group">
          <button type="submit" class="btn btn-primary" id="btn-submit">提交申请</button>
          <button type="button" class="btn btn-secondary" onclick="resetForm()">重置</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ── 申请查询页 ── -->
  <div id="page-query" style="display:none">

    <div class="card">
      <div class="card-title">🔍 查询差旅申请</div>
      <div class="search-bar">
        <input type="text" id="search-email" placeholder="输入申请人邮箱查询..." />
        <button class="btn btn-primary" onclick="searchRequests()">查询</button>
        <button class="btn btn-secondary" onclick="loadAllRequests()">全部</button>
      </div>
      <div id="query-result"></div>
    </div>

    <!-- 申请详情弹窗 -->
    <div id="detail-panel" style="display:none">
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
          <div class="card-title" style="margin:0">📄 申请详情</div>
          <button class="btn btn-secondary" onclick="closeDetail()" style="padding:6px 14px">关闭</button>
        </div>
        <div id="detail-content"></div>
        <div style="margin-top:16px">
          <div class="card-title" style="font-size:14px">审批历史</div>
          <div id="approval-history"></div>
        </div>
      </div>
    </div>
  </div>

</div>

<script>
const API_BASE = '/api/travel';

// ── 标签页切换 ──────────────────────────────────────
function switchTab(tab) {
  document.getElementById('page-submit').style.display = tab === 'submit' ? '' : 'none';
  document.getElementById('page-query').style.display = tab === 'query' ? '' : 'none';
  document.getElementById('tab-submit').className = 'tab' + (tab === 'submit' ? ' active' : '');
  document.getElementById('tab-query').className = 'tab' + (tab === 'query' ? ' active' : '');
  if (tab === 'query') loadAllRequests();
}

// ── 金额提示 ────────────────────────────────────────
function updateAmountHint() {
  const amount = parseFloat(document.getElementById('estimatedAmount').value);
  const hint = document.getElementById('amount-hint');
  if (!amount || amount <= 0) { hint.style.display = 'none'; return; }
  hint.style.display = 'block';
  if (amount <= 1000) {
    hint.className = 'amount-hint auto';
    hint.textContent = '✅ 此金额将自动审批通过（≤ 1,000元）';
  } else if (amount <= 10000) {
    hint.className = 'amount-hint single';
    hint.textContent = '⏳ 此金额需要直接上级审批（1,001 - 10,000元）';
  } else {
    hint.className = 'amount-hint multi';
    hint.textContent = '⚠️ 此金额需要三级审批（直接上级 → 部门经理 → 财务）';
  }
}

// ── 提交申请 ────────────────────────────────────────
document.getElementById('travel-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('btn-submit');
  btn.disabled = true;
  btn.textContent = '提交中...';
  showAlert('', '');

  const amount = parseFloat(document.getElementById('estimatedAmount').value);
  if (amount > 10000) {
    const deptMgr = document.getElementById('departmentManagerEmail').value;
    const finance = document.getElementById('financeEmail').value;
    if (!deptMgr || !finance) {
      showAlert('error', '申请金额 > 10,000元时，部门经理邮箱和财务负责人邮箱为必填项');
      btn.disabled = false;
      btn.textContent = '提交申请';
      return;
    }
  }

  const body = {
    employeeName: document.getElementById('employeeName').value,
    employeeEmail: document.getElementById('employeeEmail').value,
    destination: document.getElementById('destination').value,
    costCenter: document.getElementById('costCenter').value,
    departureDate: document.getElementById('departureDate').value,
    returnDate: document.getElementById('returnDate').value,
    estimatedAmount: amount,
    currency: 'CNY',
    purpose: document.getElementById('purpose').value,
    managerEmail: document.getElementById('managerEmail').value,
    departmentManagerEmail: document.getElementById('departmentManagerEmail').value || null,
    financeEmail: document.getElementById('financeEmail').value || null,
    status: 'DRAFT',
  };

  try {
    // 1. 创建申请记录
    const createRes = await fetch(`${API_BASE}/TravelRequests`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    });

    if (!createRes.ok) {
      const err = await createRes.json();
      throw new Error(err.error?.message || '申请创建失败');
    }

    const created = await createRes.json();
    const requestId = created.ID;

    // 2. 提交申请（触发审批工作流）
    const submitRes = await fetch(`${API_BASE}/submitRequest`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ requestId }),
    });

    const submitResult = await submitRes.json();

    if (submitResult.value?.success !== false) {
      showAlert('success',
        `✅ 申请已成功提交！申请编号：${requestId.substring(0, 8)}...<br>` +
        `状态：${translateStatus(submitResult.value?.status || 'PENDING')}<br>` +
        `${submitResult.value?.message || '审批流程已启动，请关注 Teams 消息通知。'}`
      );
      resetForm();
    } else {
      showAlert('error', `提交失败：${submitResult.value?.message || '未知错误'}`);
    }
  } catch (err) {
    showAlert('error', `提交失败：${err.message}`);
  }

  btn.disabled = false;
  btn.textContent = '提交申请';
});

function showAlert(type, msg) {
  const el = document.getElementById('submit-alert');
  if (!msg) { el.style.display = 'none'; return; }
  el.className = `alert alert-${type}`;
  el.innerHTML = msg;
  el.style.display = 'block';
  el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
}

function resetForm() {
  document.getElementById('travel-form').reset();
  document.getElementById('amount-hint').style.display = 'none';
}

// ── 查询申请 ────────────────────────────────────────
async function loadAllRequests() {
  document.getElementById('search-email').value = '';
  await fetchRequests('');
}

async function searchRequests() {
  const email = document.getElementById('search-email').value.trim();
  await fetchRequests(email);
}

async function fetchRequests(emailFilter) {
  const el = document.getElementById('query-result');
  el.innerHTML = '<div class="loading">加载中...</div>';
  document.getElementById('detail-panel').style.display = 'none';

  try {
    let url = `${API_BASE}/TravelRequests?$orderby=createdAt desc&$top=50`;
    if (emailFilter) {
      url += `&$filter=employeeEmail eq '${encodeURIComponent(emailFilter)}'`;
    }
    const res = await fetch(url);
    const data = await res.json();
    const items = data.value || [];

    if (items.length === 0) {
      el.innerHTML = '<div class="empty-state"><div class="icon">📭</div>暂无差旅申请记录</div>';
      return;
    }

    el.innerHTML = `
      <table>
        <thead>
          <tr>
            <th>申请人</th>
            <th>目的地</th>
            <th>出发日期</th>
            <th>金额（元）</th>
            <th>状态</th>
            <th>操作</th>
          </tr>
        </thead>
        <tbody>
          ${items.map(r => `
            <tr>
              <td>${r.employeeName}</td>
              <td>${r.destination}</td>
              <td>${r.departureDate}</td>
              <td>${Number(r.estimatedAmount).toLocaleString('zh-CN', {minimumFractionDigits: 2})}</td>
              <td><span class="status-badge status-${r.status}">${translateStatus(r.status)}</span></td>
              <td><button class="btn btn-secondary" style="padding:4px 12px;font-size:12px" onclick="viewDetail('${r.ID}')">查看</button></td>
            </tr>
          `).join('')}
        </tbody>
      </table>
      <div style="font-size:12px;color:#6a6d70;margin-top:8px">共 ${items.length} 条记录</div>
    `;
  } catch (err) {
    el.innerHTML = `<div class="alert alert-error">加载失败：${err.message}</div>`;
  }
}

async function viewDetail(id) {
  const panel = document.getElementById('detail-panel');
  const content = document.getElementById('detail-content');
  const history = document.getElementById('approval-history');
  content.innerHTML = '<div class="loading">加载中...</div>';
  history.innerHTML = '';
  panel.style.display = 'block';
  panel.scrollIntoView({ behavior: 'smooth' });

  try {
    const res = await fetch(`${API_BASE}/TravelRequests(${id})`);
    const r = await res.json();
    // 单独查询审批记录
    const arRes = await fetch(`${API_BASE}/ApprovalRecords?$filter=travelRequest_ID eq ${id}&$orderby=createdAt asc`);
    const arData = await arRes.json();
    r.approvalRecords = arData.value || [];

    content.innerHTML = `
      <div class="detail-row">
        <span class="detail-label">申请编号</span>
        <span class="detail-value" style="font-family:monospace;font-size:12px">${r.ID}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">申请人</span>
        <span class="detail-value">${r.employeeName} (${r.employeeEmail})</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">目的地</span>
        <span class="detail-value">${r.destination}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">出行日期</span>
        <span class="detail-value">${r.departureDate} → ${r.returnDate}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">申请金额</span>
        <span class="detail-value" style="color:#0a6ed1;font-size:16px;font-weight:700">
          ¥${Number(r.estimatedAmount).toLocaleString('zh-CN', {minimumFractionDigits: 2})}
        </span>
      </div>
      <div class="detail-row">
        <span class="detail-label">成本中心</span>
        <span class="detail-value">${r.costCenter}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">当前状态</span>
        <span class="detail-value"><span class="status-badge status-${r.status}">${translateStatus(r.status)}</span></span>
      </div>
      <div class="detail-row">
        <span class="detail-label">出行事由</span>
        <span class="detail-value">${r.purpose}</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">提交时间</span>
        <span class="detail-value">${new Date(r.createdAt).toLocaleString('zh-CN')}</span>
      </div>
    `;

    const records = r.approvalRecords || [];
    if (records.length === 0) {
      history.innerHTML = '<div style="color:#6a6d70;font-size:13px;padding:8px 0">暂无审批记录</div>';
    } else {
      history.innerHTML = records.map(a => `
        <div class="history-item">
          <div class="approver">
            ${a.decision === 'APPROVED' ? '✅' : '❌'}
            ${a.approverName || a.approverEmail}
            <span style="font-size:12px;font-weight:400;color:#6a6d70">（${translateLevel(a.approverLevel)}）</span>
          </div>
          <div class="meta">
            决策：${a.decision === 'APPROVED' ? '审批通过' : '已拒绝'}
            ${a.comments ? ' | 备注：' + a.comments : ''}
            ${a.decidedAt ? ' | ' + new Date(a.decidedAt).toLocaleString('zh-CN') : ''}
          </div>
        </div>
      `).join('');
    }
  } catch (err) {
    content.innerHTML = `<div class="alert alert-error">加载失败：${err.message}</div>`;
  }
}

function closeDetail() {
  document.getElementById('detail-panel').style.display = 'none';
}

// ── 辅助函数 ────────────────────────────────────────
function translateStatus(s) {
  const map = {
    DRAFT: '草稿',
    PENDING: '待处理',
    AUTO_APPROVED: '已自动审批',
    L1_REVIEWING: '一级审批中',
    MULTI_LEVEL_REVIEWING: '多级审批中',
    APPROVED: '已批准',
    REJECTED: '已拒绝',
  };
  return map[s] || s;
}

function translateLevel(l) {
  const map = {
    AUTO: '系统自动',
    L1_MANAGER: '直接上级',
    L2_DEPT_MANAGER: '部门经理',
    L3_FINANCE: '财务负责人',
  };
  return map[l] || l;
}
</script>
</body>
</html>
